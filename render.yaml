# Render.com one-click deploy blueprint for Streamlit.
# In the Render dashboard: New + > Blueprint > pick this repo.
services:
  - type: web
    name: phishguard-streamlit
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # SQLite lives on ephemeral disk; perfect for college demo / cloud instance
      - key: PHISHGUARD_DB
        value: /tmp/phishguard.db
