{% extends "base.html" %} {% block title %}{{ code }} — {{ title }}{% endblock
%} {% block content %}
<section class="error-page" data-reveal>
  <div class="error-code" aria-hidden="true">{{ code }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="error-actions">
    <a class="btn btn-primary" href="{{ url_for('index') }}">
      <svg class="icon" aria-hidden="true"><use href="#i-gauge"></use></svg>Back
      to dashboard
    </a>
    <a class="btn btn-ghost" href="{{ url_for('history') }}"
      >View scan history</a
    >
  </div>
</section>
{% endblock %}
